{% extends "base.html" %}
{% block title %}{{ 'Edit Property' if property else 'New Property' }}{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('properties.list_properties') }}">Properties</a> / {{ 'Edit' if property else 'New' }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ 'Edit Property' if property else 'Add New Property' }}</h1>
</div>
<div class="card stat-card p-4" style="max-width:680px;">
  <form method="post">
    <div class="mb-3">
      <label class="form-label fw-semibold">Property Name *</label>
      <input type="text" name="name" class="form-control" required
             value="{{ property.name if property else '' }}" placeholder="e.g. Sunset Apartments">
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Address *</label>
      <input type="text" name="address" class="form-control" required
             value="{{ property.address if property else '' }}" placeholder="Street address">
    </div>
    <div class="row g-2 mb-3">
      <div class="col-md-5">
        <label class="form-label fw-semibold">City *</label>
        <input type="text" name="city" class="form-control" required
               value="{{ property.city if property else '' }}">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold">State *</label>
        <input type="text" name="state" class="form-control" required
               value="{{ property.state if property else '' }}">
      </div>
      <div class="col-md-3">
        <label class="form-label fw-semibold">Zip Code *</label>
        <input type="text" name="zip_code" class="form-control" required
               value="{{ property.zip_code if property else '' }}">
      </div>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Property Type *</label>
        <select name="property_type" class="form-select" required>
          {% for t in ['apartment', 'house', 'condo', 'commercial', 'townhouse', 'duplex'] %}
          <option value="{{ t }}" {{ 'selected' if property and property.property_type == t else '' }}>
            {{ t|capitalize }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Number of Units</label>
        <input type="number" name="num_units" class="form-control" min="1"
               value="{{ property.num_units if property else 1 }}">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Description</label>
      <textarea name="description" class="form-control" rows="3">{{ property.description if property else '' }}</textarea>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-check-circle me-1"></i>{{ 'Update Property' if property else 'Add Property' }}
      </button>
      <a href="{{ url_for('properties.list_properties') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
