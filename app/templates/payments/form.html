{% extends "base.html" %}
{% block title %}{{ 'Edit Payment' if payment else 'Record Payment' }}{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('payments.list_payments') }}">Payments</a> / {{ 'Edit' if payment else 'New' }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ 'Edit Payment' if payment else 'Record Payment' }}</h1>
</div>
<div class="card stat-card p-4" style="max-width:600px;">
  <form method="post">
    <div class="mb-3">
      <label class="form-label fw-semibold">Lease *</label>
      <select name="lease_id" class="form-select" required>
        <option value="">Select lease…</option>
        {% for lease in leases %}
        <option value="{{ lease.id }}"
          {{ 'selected' if payment and payment.lease_id == lease.id else '' }}>
          {{ lease.tenant.full_name }} — {{ lease.unit.property.name }} Unit {{ lease.unit.unit_number }}
          ({{ lease.status }})
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Amount ($) *</label>
        <input type="number" name="amount" class="form-control" min="0" step="0.01" required
               value="{{ payment.amount if payment else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Payment Type</label>
        <select name="payment_type" class="form-select">
          {% for t in ['rent', 'deposit', 'late_fee', 'other'] %}
          <option value="{{ t }}" {{ 'selected' if payment and payment.payment_type == t else ('' if t != 'rent' else 'selected') }}>
            {{ t|replace('_',' ')|capitalize }}
          </option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Payment Date *</label>
        <input type="date" name="payment_date" class="form-control" required
               value="{{ payment.payment_date if payment else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Due Date *</label>
        <input type="date" name="due_date" class="form-control" required
               value="{{ payment.due_date if payment else '' }}">
      </div>
    </div>
    <div class="row g-2 mb-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Payment Method</label>
        <select name="payment_method" class="form-select">
          <option value="">—</option>
          {% for m in ['cash', 'check', 'online', 'bank_transfer', 'credit_card'] %}
          <option value="{{ m }}" {{ 'selected' if payment and payment.payment_method == m else '' }}>
            {{ m|replace('_',' ')|capitalize }}
          </option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Status</label>
        <select name="status" class="form-select">
          {% for s in ['paid', 'pending', 'late', 'partial'] %}
          <option value="{{ s }}" {{ 'selected' if payment and payment.status == s else ('' if s != 'paid' else 'selected') }}>
            {{ s|capitalize }}
          </option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Notes</label>
      <textarea name="notes" class="form-control" rows="2">{{ payment.notes if payment else '' }}</textarea>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-check-circle me-1"></i>{{ 'Update Payment' if payment else 'Record Payment' }}
      </button>
      <a href="{{ url_for('payments.list_payments') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
