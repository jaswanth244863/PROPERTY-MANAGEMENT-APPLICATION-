{% extends "base.html" %}
{% block title %}{{ 'Edit Tenant' if tenant else 'New Tenant' }}{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('tenants.list_tenants') }}">Tenants</a> / {{ 'Edit' if tenant else 'New' }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ 'Edit Tenant' if tenant else 'Add New Tenant' }}</h1>
</div>
<div class="card stat-card p-4" style="max-width:600px;">
  <form method="post">
    <div class="row g-2 mb-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">First Name *</label>
        <input type="text" name="first_name" class="form-control" required
               value="{{ tenant.first_name if tenant else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Last Name *</label>
        <input type="text" name="last_name" class="form-control" required
               value="{{ tenant.last_name if tenant else '' }}">
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold">Email *</label>
      <input type="email" name="email" class="form-control" required
             value="{{ tenant.email if tenant else '' }}">
    </div>
    <div class="row g-2 mb-3">
      <div class="col-md-6">
        <label class="form-label fw-semibold">Phone *</label>
        <input type="tel" name="phone" class="form-control" required
               value="{{ tenant.phone if tenant else '' }}" placeholder="e.g. 555-123-4567">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-semibold">Date of Birth</label>
        <input type="date" name="date_of_birth" class="form-control"
               value="{{ tenant.date_of_birth if tenant and tenant.date_of_birth else '' }}">
      </div>
    </div>
    <hr/>
    <div class="fw-semibold mb-2">Emergency Contact</div>
    <div class="row g-2 mb-3">
      <div class="col-md-6">
        <label class="form-label">Contact Name</label>
        <input type="text" name="emergency_contact_name" class="form-control"
               value="{{ tenant.emergency_contact_name if tenant else '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label">Contact Phone</label>
        <input type="tel" name="emergency_contact_phone" class="form-control"
               value="{{ tenant.emergency_contact_phone if tenant else '' }}">
      </div>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-check-circle me-1"></i>{{ 'Update Tenant' if tenant else 'Add Tenant' }}
      </button>
      <a href="{{ url_for('tenants.list_tenants') }}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
