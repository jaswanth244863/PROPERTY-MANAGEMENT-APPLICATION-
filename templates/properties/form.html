{% extends "base.html" %}
{% block title %}{{ action }} Property – PMS{% endblock %}
{% block page_title %}{{ action }} Property{% endblock %}

{% block content %}
<div class="page-header">
  <h2>{{ '🏢 Edit Property' if action == 'Edit' else '🏢 Add New Property' }}</h2>
  <a href="{{ url_for('properties') }}" class="btn btn-outline">← Back to Properties</a>
</div>

<div class="card" style="max-width:800px;">
  <div class="card-header"><h5>Property Details</h5></div>
  <div class="card-body">
    <form method="post">
      <div class="form-grid">
        <div class="form-group form-full">
          <label for="name">Property Name *</label>
          <input type="text" id="name" name="name" class="form-control" required
                 value="{{ property.name if property else '' }}" placeholder="e.g. Sunset Apartments Unit 1A" />
        </div>

        <div class="form-group form-full">
          <label for="address">Address *</label>
          <input type="text" id="address" name="address" class="form-control" required
                 value="{{ property.address if property else '' }}" placeholder="123 Main Street, City, State ZIP" />
        </div>

        <div class="form-group">
          <label for="property_type">Property Type *</label>
          <select id="property_type" name="property_type" class="form-control" required>
            {% set types = ['Apartment', 'House', 'Commercial', 'Condo', 'Townhouse', 'Studio'] %}
            {% for t in types %}
              <option value="{{ t }}" {{ 'selected' if property and property.property_type == t else '' }}>{{ t }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="units">Number of Units</label>
          <input type="number" id="units" name="units" class="form-control" min="1"
                 value="{{ property.units if property else 1 }}" />
        </div>

        <div class="form-group">
          <label for="rent_amount">Monthly Rent ($) *</label>
          <input type="number" id="rent_amount" name="rent_amount" class="form-control"
                 step="0.01" min="0" required
                 value="{{ property.rent_amount if property else '' }}" placeholder="0.00" />
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" name="status" class="form-control">
            {% for s in ['Available', 'Occupied', 'Maintenance'] %}
              <option value="{{ s }}" {{ 'selected' if property and property.status == s else '' }}>{{ s }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group form-full">
          <label for="description">Description</label>
          <textarea id="description" name="description" class="form-control"
                    placeholder="Optional description…">{{ property.description if property else '' }}</textarea>
        </div>
      </div>

      <div style="margin-top:20px; display:flex; gap:10px;">
        <button type="submit" class="btn btn-primary">💾 {{ action }} Property</button>
        <a href="{{ url_for('properties') }}" class="btn btn-outline">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
